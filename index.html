<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>통합 관리 시스템</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            color: var(--text-main);
            font-size: 32px;
            margin: 0 0 12px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            color: var(--text-sub);
            font-size: 16px;
            margin: 0;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
        }

        .menu-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 40px 32px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .menu-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: rgba(37, 99, 235, 0.2);
        }

        .icon-wrapper {
            width: 72px;
            height: 72px;
            background-color: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            margin-bottom: 24px;
            color: var(--primary-color);
            transition: background-color 0.3s ease;
        }

        .menu-card:hover .icon-wrapper {
            background-color: var(--primary-color);
            color: white;
        }

        .menu-card h2 {
            color: var(--text-main);
            font-size: 22px;
            margin: 0 0 12px 0;
            font-weight: 700;
        }

        .menu-card p {
            color: var(--text-sub);
            font-size: 15px;
            line-height: 1.5;
            margin: 0;
        }

        /* 모바일 화면 최적화 */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 28px;
            }
            .menu-card {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="menu-grid">
            <a href="연락처.html" class="menu-card">
                <div class="icon-wrapper">
                    📞
                </div>
                <h2>연락처</h2>
            </a>

            <a href="세대매뉴얼.html" class="menu-card">
                <div class="icon-wrapper">
                    📖
                </div>
                <h2>세대 매뉴얼</h2>
            </a>
        </div>
    </div>

</body>
</html>
