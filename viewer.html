<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF 뷰어</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background-color: #333; color: white;
            display: flex; flex-direction: column; align-items: center;
            font-family: sans-serif; overflow-x: hidden;
        }
        
        /* 툴바 모바일 레이아웃 최적화 */
        #toolbar {
            background-color: #222; width: 100%; padding: 10px 5px;
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            box-sizing: border-box; box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        .nav-group { display: flex; align-items: center; gap: 5px; }

        button {
            background: #555; color: white; border: none; padding: 8px 12px;
            cursor: pointer; border-radius: 4px; font-weight: bold; font-size: 14px;
        }
        button:active { background: #777; }
        .back-btn { background: #0366d6; }
        
        /* 드롭다운 메뉴 스타일 */
        #page-select {
            background: #444; color: white; border: 1px solid #666;
            padding: 8px 10px; border-radius: 4px; font-size: 14px;
            cursor: pointer; text-align: center;
        }

        #pdf-render { 
            width: 100vw !important; 
            height: auto !important;
            background: white; display: block;
        }
    </style>
</head>
<body>
    <div id="toolbar">
        <button class="back-btn" onclick="location.href='index.html'">목록</button>
        
        <div class="nav-group">
            <button id="prev-page">◀</button>
            <!-- 페이지 번호를 누르면 펼쳐지는 드롭다운 -->
            <select id="page-select"></select>
            <button id="next-page">▶</button>
        </div>
    </div>

    <canvas id="pdf-render"></canvas>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const pdfName = urlParams.get('file');

        if (!pdfName) {
            alert("파일이 지정되지 않았습니다.");
            location.href = 'index.html';
        } else {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

            let pdfDoc = null,
                pageNum = 1,
                pageIsRendering = false,
                pageNumIsPending = null;

            const canvas = document.getElementById('pdf-render'),
                  ctx = canvas.getContext('2d'),
                  pageSelect = document.getElementById('page-select');

            // 드롭다운 메뉴에 페이지 번호 채워넣기
            const setupDropdown = (totalPages) => {
                pageSelect.innerHTML = '';
                for (let i = 1; i <= totalPages; i++) {
                    let option = document.createElement('option');
                    option.value = i;
                    option.text = `${i} / ${totalPages} 쪽`;
                    pageSelect.appendChild(option);
                }
                
                // 사용자가 드롭다운에서 페이지를 선택하면 해당 페이지로 이동
                pageSelect.addEventListener('change', (e) => {
                    pageNum = parseInt(e.target.value);
                    queueRenderPage(pageNum);
                    window.scrollTo(0, 0);
                });
            };

            const renderPage = num => {
                pageIsRendering = true;
                pdfDoc.getPage(num).then(page => {
                    const unscaledViewport = page.getViewport({ scale: 1 });
                    const scale = window.innerWidth / unscaledViewport.width;
                    const viewport = page.getViewport({ scale: scale });
                    const outputScale = window.devicePixelRatio || 1;
                    
                    canvas.width = Math.floor(viewport.width * outputScale);
                    canvas.height = Math.floor(viewport.height * outputScale);
                    const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                    const renderCtx = { canvasContext: ctx, viewport: viewport, transform: transform };
                    
                    page.render(renderCtx).promise.then(() => {
                        pageIsRendering = false;
                        if (pageNumIsPending !== null) {
                            renderPage(pageNumIsPending);
                            pageNumIsPending = null;
                        }
                    });
                    
                    // 현재 렌더링된 페이지 번호로 드롭다운 메뉴 값 업데이트
                    pageSelect.value = num;
                });
            };

            const queueRenderPage = num => {
                if (pageIsRendering) { pageNumIsPending = num; } 
                else { renderPage(num); }
            };

            document.getElementById('prev-page').addEventListener('click', () => {
                if (pageNum <= 1) return;
                pageNum--;
                queueRenderPage(pageNum);
                window.scrollTo(0, 0);
            });

            document.getElementById('next-page').addEventListener('click', () => {
                if (pageNum >= pdfDoc.numPages) return;
                pageNum++;
                queueRenderPage(pageNum);
                window.scrollTo(0, 0);
            });

            window.addEventListener('resize', () => { if (pdfDoc) renderPage(pageNum); });

            // PDF 파일 불러오기
            pdfjsLib.getDocument(pdfName).promise.then(pdfDoc_ => {
                pdfDoc = pdfDoc_;
                // PDF를 성공적으로 불러오면 드롭다운 메뉴를 세팅합니다.
                setupDropdown(pdfDoc.numPages);
                renderPage(pageNum);
            }).catch(err => {
                alert("파일을 찾을 수 없습니다. (폴더나 파일명을 확인하세요)");
            });
        }
    </script>
</body>
</html>
